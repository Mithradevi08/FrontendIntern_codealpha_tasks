<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Gallery</h1>
    <input id="search" type="search" placeholder="Search by title" aria-label="Search images">
    <nav id="filters" class="filters" aria-label="Categories"></nav>
  </header>

  <main>
    <p id="empty" class="empty" hidden>No images match. Try another category or search.</p>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close viewer">&times;</button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous image">&#8249;</button>
    <figure class="lb-fig">
      <img id="lbImg" alt="">
      <figcaption><span id="lbTitle"></span> <span id="lbCount"></span></figcaption>
    </figure>
    <button class="lb-btn lb-next" id="lbNext" aria-label="Next image">&#8250;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
